name: Mon Panier - Catalogue Lidl Aldi Netto (sans IA)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_store_catalog.py'
      - 'data/retail/official-references.json'
      - '.github/workflows/catalogue-enseignes.yml'
  schedule:
    # Le dimanche : catalogue actualisé avant la génération IA du lundi.
    - cron: '20 5 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mon-panier-catalogue
  cancel-in-progress: false

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Vérifier le script de synchronisation
        run: python -m py_compile scripts/sync_store_catalog.py
      - name: Actualiser les produits depuis Open Food Facts (sans tokens IA)
        run: python scripts/sync_store_catalog.py
      - name: Publier le catalogue
        run: |
          if [ ! -f data/retail/catalog.json ]; then
            echo "::error::Aucun catalogue produit fiable, publication abandonnée."
            exit 1
          fi
          git config user.name "mon-panier-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Garder le résultat à part. Ne jamais réappliquer un vieux commit
          # avec rebase : cela crée des conflits si le catalogue a changé.
          candidate="$(mktemp)"
          cp data/retail/catalog.json "$candidate"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$candidate" data/retail/catalog.json
            git add data/retail/catalog.json
            if git diff --cached --quiet; then
              echo "Catalogue déjà identique à la version publiée."
              exit 0
            fi
            git commit -m "Actualise catalogue enseignes sans IA"
            if git push origin HEAD:main; then
              echo "Catalogue publié."
              exit 0
            fi
            echo "Le dépôt a changé durant la publication : nouvelle tentative."
            sleep 3
          done
          echo "::error::Impossible de publier le catalogue après trois tentatives."
          exit 1
