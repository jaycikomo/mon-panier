# Mon Panier — reverse proxy public IPv4, certificat IP Let's Encrypt.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://82.66.229.233$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name 82.66.229.233;
    server_tokens off;
    client_max_body_size 512k;

    ssl_certificate /etc/letsencrypt/live/mon-panier-prod/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mon-panier-prod/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MONPANIER_SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /health {
        include /etc/nginx/snippets/mon-panier-proxy.conf;
    }

    # Prévisualisation sur l'IP HTTPS, sans modifier GitHub Pages.
    # Endpoints exacts : aucun accès aux autres fichiers du dépôt.
    location = /essai-famille {
        alias /var/www/mon-panier-preview/index.html;
        default_type text/html;
        expires -1;
    }

    location = /family-sync.js {
        alias /var/www/mon-panier-preview/family-sync.js;
        default_type application/javascript;
        expires -1;
    }

    location ~ ^/api/(login|join|bootstrap)$ {
        limit_req zone=monpanier_auth burst=5 nodelay;
        include /etc/nginx/snippets/mon-panier-proxy.conf;
    }

    location /api/ {
        limit_req zone=monpanier_general burst=30 nodelay;
        include /etc/nginx/snippets/mon-panier-proxy.conf;
    }

    location / {
        return 404;
    }
}
