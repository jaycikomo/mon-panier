services:
  db:
    image: postgres:17-alpine
    container_name: mon-panier-db
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER}\" -d \"${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  api:
    build: ./source/backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://monpanier:${POSTGRES_PASSWORD}@db:5432/monpanier
      JWT_SECRET: ${JWT_SECRET}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "127.0.0.1:8085:8000"
    networks: [private,edge]
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:

networks:
  private:
    internal: true
  edge:
