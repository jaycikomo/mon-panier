const src=id=>INLINE_PHOTOS[id]||null;
function img(id,cls='meal-pic'){const info=DATA.ingredients[id],pic=src(id);return state.photos&&pic?`<img class="${cls}" src="${pic}" loading="lazy" alt="Photo illustrative : ${esc(info.name)}">`:`<span class="${cls==='meal-pic'?'prod-emoji':cls}" aria-label="${esc(info.name)}">${info.emoji||'🥬'}</span>`;}
function mealThumb(key,cls='meal-pic'){
 const r=DATA.recipes[key];
 const photo=r&&typeof r.photo==='string'&&
   /^https:\/\/raw\.githubusercontent\.com\/jaycikomo\/mon-panier\/main\/images\/ia\/[\w/.-]+\.webp$/.test(r.photo)?r.photo:null;
 if(photo&&state.photos)return `<img class="${cls}" loading="lazy" src="${esc(photo)}" alt="Photo illustrative de ${esc(r.name)}">`;
 return img(state.subs[r.items[0].id]||r.items[0].id,cls);
}
function fmt(n){return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(n)}
function gram(n,id){const v=Math.round(n);if(id==='oeufs')return `${Math.max(1,Math.ceil(v/60))} œuf${Math.ceil(v/60)>1?'s':''} (≈ ${fmt(v)} g)`;if(id==='citron')return `${Math.max(1,Math.round(v/90))} citron(s)`;if(id==='huile'||id==='huilecolza')return `${fmt(v)} g (≈ ${fmt(v/0.91)} ml)`;if(v>=1000)return `${new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2}).format(v/1000)} kg`;return `${fmt(v)} g`}
function kcalc(id,g){const a=DATA.ingredients[id]?.macros||[0,0,0];return a.map(x=>x*g/100)}
function macros(items,withSubs=false){const m=[0,0,0];items.forEach(({id,g})=>{const a=kcalc(withSubs?(state.subs[id]||id):id,g);a.forEach((v,i)=>m[i]+=v)});return {p:m[0],c:m[1],f:m[2],cal:m[0]*4+m[1]*4+m[2]*9}}
function mealMacros(key){return macros(DATA.recipes[key].items,true)}
function dayMacros(i){const totals=[0,0,0];DATA.plan[i].forEach(key=>{let m=mealMacros(key);totals[0]+=m.p;totals[1]+=m.c;totals[2]+=m.f});return {p:totals[0],c:totals[1],f:totals[2],cal:totals[0]*4+totals[1]*4+totals[2]*9}}
function listData(){const items={};DATA.plan.flat().forEach(key=>DATA.recipes[key].items.forEach(({id,g})=>{if(!items[id])items[id]={id,g:0,isManual:false};items[id].g+=g*state.people}));const all=Object.values(items).map(it=>({...it,name:DATA.ingredients[state.subs[it.id]||it.id]?.name||it.id,eff:state.subs[it.id]||it.id,aisle:DATA.ingredients[state.subs[it.id]||it.id]?.aisle||'Divers'}));
 return [...all,...state.manual.map(x=>({...x,name:x.name,aisle:'Ajouts personnels',isManual:true}))];}
// Ordre de recherche conseillé : Lidl, Aldi, Netto, puis magasins de secours (stock inconnu).
// Ceci est une préférence de répartition, pas une vérification des stocks en magasin.
const STORE_PRIORITY=['lidl-destrousse','aldi','netto','inter'];
function chosen(){
 return stores.filter(s=>state.stores.includes(s.id)).sort((a,b)=>{
  const ia=STORE_PRIORITY.indexOf(a.id),ib=STORE_PRIORITY.indexOf(b.id);
  return (ia<0?100:ia)-(ib<0?100:ib);
 });
}
function blockedStores(id){
 const x=state.unavailable&&state.unavailable[id];
 return Array.isArray(x)?x.filter(v=>typeof v==='string'):[];
}
function eligibleStores(id){
 const blocked=blockedStores(id);
 return chosen().filter(s=>!blocked.includes(s.id));
}
function assigned(id,aisle){
 const storesReady=eligibleStores(id);
 if(state.assign[id]&&storesReady.some(s=>s.id===state.assign[id]))return state.assign[id];
 return storesReady.length?storesReady[0].id:'';
}
function safeRetailUrl(url){
 if(typeof url!=='string')return false;
 try{
  const parsed=new URL(url);
  return parsed.protocol==='https:'&&['www.lidl.fr','www.aldi.fr','www.netto.fr','world.openfoodfacts.org'].includes(parsed.hostname);
 }catch{return false}
}
function evidenceFor(id,storeId){
 const tag=storeId==='aldi'?'aldi':storeId==='netto'?'netto':storeId&&storeId.startsWith('lidl-')?'lidl':'';
 const matches=tag&&retailCatalog?.evidence?.[id]?.[tag];
 if(!Array.isArray(matches))return null;
 return matches.find(x=>safeRetailUrl(x.url)&&(
  (x.source==='Site officiel'&&x.kind==='product')||
  (x.source==='Open Food Facts'&&/^\d{8,14}$/.test(String(x.ean)))
 ))||null;
}
function progress(){const a=listData();return {done:a.filter(x=>!!state.checked[x.id]).length,total:a.length}}
function notify(msg){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function header(){return `<header class="top"><div class="shell top-inner"><button class="brand" data-action="goto" data-tab="plan"><span class="brand-mark">🥬</span><span><div class="brand-name">Mon Panier</div><div class="brand-sub">Menus & courses</div></span></button><div class="top-actions"><span class="pill">📍 La Bouilladisse</span><button class="btn btn-small share-header" data-action="share" aria-label="Partager la liste de courses">📤 <span>Partager</span></button><button class="btn btn-small" data-action="goto" data-tab="courses">🛒 Courses</button></div></div></header>`}
function hero(){const count=progress();return `<section class="hero"><div><div class="eyebrow">🌿 Mangeons bon, mangeons simple</div><h1>Votre semaine dans le panier.</h1><p>7 jours de repas renouvelés chaque lundi, une liste intelligente et les commerces autour de La Bouilladisse.</p></div><div class="hero-badges"><span>🔥 ≈ 1 900 kcal / jour</span><span>💪 ≈ 130 g de protéines</span></div></section><nav class="mainnav" aria-label="Navigation"><button class="nav-btn ${ui.tab==='plan'?'active':''}" data-action="goto" data-tab="plan">📅 Ma semaine</button><button class="nav-btn ${ui.tab==='archives'?'active':''}" data-action="goto" data-tab="archives">🗂️ Archives</button><button class="nav-btn ${ui.tab==='courses'?'active':''}" data-action="goto" data-tab="courses">✅ Liste de courses ${count.done}/${count.total}</button><button class="nav-btn ${ui.tab==='recettes'?'active':''}" data-action="goto" data-tab="recettes">🍽️ Recettes</button><button class="nav-btn ${ui.tab==='magasins'?'active':''}" data-action="goto" data-tab="magasins">📍 Mes commerces</button></nav>`}
function storeCards(){const types=(ui.shopType==='Tous'?stores:stores.filter(s=>s.type===ui.shopType)).slice().sort((a,b)=>{
 const ia=STORE_PRIORITY.indexOf(a.id),ib=STORE_PRIORITY.indexOf(b.id);
 return (ia<0?100:ia)-(ib<0?100:ib);
});return `<div class="site-grid">${types.map(s=>{const selected=state.stores.includes(s.id);return `<article class="card site-card ${selected?'selected':''}" data-action="toggle-store-card" data-id="${s.id}"><input class="store-check" type="checkbox" aria-label="Choisir ${esc(s.name)} ${esc(s.town)}" data-store="${s.id}" ${selected?'checked':''}><span class="shop-icon">${s.emoji}</span><div class="shop-body"><div class="category">${s.type.toUpperCase()} · ${esc(s.town)}</div><h3>${esc(s.name)}</h3><p>${esc(s.address)}</p>${s.hint?`<div class="${s.future?'market-note':'tiny-pill'}">${esc(s.hint)}</div>`:''}<div><a class="shop-link" target="_blank" rel="noopener noreferrer" href="${s.url||maps(s.address)}" data-action="external">${s.url?'ℹ️ Informations officielles':'↗ Itinéraire'}</a>${s.url?` · <a class="shop-link" target="_blank" rel="noopener noreferrer" href="${maps(s.address)}" data-action="external">Itinéraire</a>`:''}</div></div></article>`}).join('')}</div>`}
function storeFilters(){return `<div class="store-filters">${['Tous','Supermarché','Marché','Primeur','Supérette'].map(x=>`<button class="chip ${ui.shopType===x?'active':''}" data-action="storetype" data-type="${x}">${x==='Tous'?'Tous les lieux':x}</button>`).join('')}</div>`}

Achetés</option></select><select id="store-filter" aria-label="Filtrer par magasin"><option>Tous les magasins</option>${chosen().map(s=>`<option value="${s.id}"${ui.shopFilter===s.id?' selected':''}>${esc(s.name)} — ${esc(s.town)}</option>`).join('')}</select><label class="toggle"><input id="photo-toggle" type="checkbox" ${state.photos?'checked':''}> Photos</label></div><div id="list-results">${listResults()}</div><div class="divider" style="height:1px;background:#ecf1eb;margin-top:14px"></div><div class="section-head"><div><h2 style="font-size:17px">Ajouter un produit</h2><p>Pour les articles qui ne figurent pas dans les recettes.</p></div></div><form id="manual-form" class="manual-add"><input class="field" id="manual-name" required maxlength="70" placeholder="Ex : café, lessive, pain…" aria-label="Nom du produit"><input class="field" id="manual-qty" maxlength="40" placeholder="Quantité (ex : 2 paquets)" aria-label="Quantité"><button class="btn" type="submit">+ Ajouter</button></form><div class="mini-links"><button class="btn btn-outline btn-small" data-action="reset-checked">↺ Réinitialiser les coches</button><button class="btn btn-outline btn-small" data-action="copy-list">📋 Copier le texte</button><button class="btn share-secondary btn-small" data-action="share" aria-label="Partager la liste de courses">📤 Partager la liste</button><button class="btn btn-outline btn-small" data-action="share-link">🔗 Lien pour importer</button></div></div><p class="caption" style="margin-top:12px">⚠️ Les photos servent de repères visuels : ce sont des illustrations génériques, pas des photos des emballages vendus par chaque enseigne.</p>`}

 return aisleOrder.map(aisle=>{let items=a.filter(x=>x.aisle===aisle);if(!items.length)return '';return `<section class="list-group"><div class="list-group-title"><h3>${esc(aisle)}</h3><span>${aisle==='Ajouts personnels'?'👈 Glissez un article à gauche pour le supprimer':items.length+' article(s)'}</span></div><div class="item-list">${items.map(itemCard).join('')}</div></section>`}).join('');}
function itemCard(x){
 const orig=x.id,subbed=!!state.subs[orig],storesList=eligibleStores(orig),selectedStore=assigned(orig,x.aisle),swipeOpen=openSwipeId===orig;
 const selectedInfo=stores.find(s=>s.id===selectedStore);
 const nextStore=storesList.find(s=>s.id!==selectedStore);
 const blocked=blockedStores(orig);
 const missingIn=blocked.map(id=>stores.find(s=>s.id===id)?.name||id).join(', ');
 const productRef=!x.isManual&&selectedStore?evidenceFor(x.eff,selectedStore):null;
 const reference=productRef?`<div class="retail-source">🔎 Exemple de produit référencé : <a href="${esc(productRef.url)}" target="_blank" rel="noopener noreferrer">${esc(productRef.name)} ↗</a><small>Fiche descriptive seulement · La présence dans ce magasin n’est pas vérifiée.</small></div>`:'';
 const storeSelect=storesList.length?`<label class="store-choice-label" for="store-choice-${esc(orig)}">🏪 Magasin où chercher</label><select id="store-choice-${esc(orig)}" class="store-assign" data-assign="${esc(orig)}" aria-label="Choisir le magasin où chercher ${esc(x.name)}">${storesList.map(s=>`<option value="${s.id}" ${s.id===selectedStore?'selected':''}>${esc(s.name)} · ${esc(s.town)}</option>`).join('')}</select><div class="store-stock-hint">📍 Proposition de recherche : stock non vérifié.</div>`:'<span class="store-unavailable">⚠ Plus aucun magasin à essayer pour cet article. Tu peux annuler tes signalements ou choisir d’autres commerces.</span>';
 const absenceActions=chosen().length?`<div class="retail-actions">
  ${selectedStore&&!state.checked[orig]?`<button type="button" class="store-missing-btn" data-action="missing-store" data-id="${esc(orig)}" data-store="${esc(selectedStore)}" aria-label="Je n’ai pas trouvé ${esc(x.name)} chez ${esc(selectedInfo?.name||'ce magasin')}">${nextStore?'👀 Je ne l’ai pas trouvé ici → Essayer '+esc(nextStore.name):'👀 Je ne l’ai pas trouvé ici'}</button>`:''}
  ${blocked.length?`<div class="store-missing-history">Noté par toi : pas trouvé chez ${esc(missingIn)}. Les autres magasins restent à vérifier.</div><button class="store-reset-btn" type="button" data-action="reset-store-availability" data-id="${esc(orig)}">↶ Annuler et recommencer</button>`:''}
 </div>`:'';
 const card=`<article class="item-card ${state.checked[orig]?'done':''} ${x.isManual?'manual-swipe-content':''}" data-product="${esc(orig)}">
  <input class="product-check" type="checkbox" data-check="${esc(orig)}" aria-label="Acheté : ${esc(x.name)}" ${state.checked[orig]?'checked':''}>
  ${x.isManual?'<span class="prod-emoji">🛍️</span>':img(x.eff,src(x.eff)?'prod-img':'prod-emoji')}
  <div class="prod-main"><div class="prod-name">${esc(x.name)}</div><div class="prod-qty">${x.isManual?esc(x.qty||'À acheter'):gram(x.g,x.eff)}</div>
   ${x.isManual?'<span class="swipe-mini-hint">← Glisser pour supprimer</span>':`<div class="prod-actions"><button class="linkbtn" data-action="toggle-sub" data-id="${esc(orig)}">${ui.openSub===orig?'Fermer':subbed?'↺ Modifier le remplacement':'⇄ Remplacer l’ingrédient'}</button>${subbed?`<span class="store-tag">À la place : ${esc(DATA.ingredients[orig].name)}</span>`:''}</div>`}
   ${chosen().length?`<div class="store-choice-wrap">${storeSelect}</div>`:''}

   ${absenceActions}
   ${ui.openSub===orig&&!x.isManual?subPanel(orig):''}

  ${x.isManual?`<div class="manual-item-controls"><button class="manual-swipe-more" type="button" data-action="toggle-manual-swipe" data-id="${esc(orig)}" aria-label="Options de suppression pour ${esc(x.name)}" aria-expanded="${swipeOpen}">⋯</button><button class="manual-desktop-delete" type="button" data-action="delete-manual" data-id="${esc(orig)}">🗑️ Supprimer</button></div>`:''}
 </article>`;
 if(!x.isManual)return card;
 return `<div class="manual-swipe ${swipeOpen?'swipe-open':''}" data-swipe-id="${esc(orig)}">
  <button class="swipe-delete" type="button" data-action="delete-manual" data-id="${esc(orig)}" aria-label="Supprimer ${esc(x.name)}" aria-hidden="${!swipeOpen}" tabindex="${swipeOpen?0:-1}">🗑️<span>Supprimer</span></button>
  ${card}
 </div>`;
}

}

function buildListText(){
 const groups=aisleOrder.map(aisle=>{
  const all=listData().filter(x=>x.aisle===aisle);
  if(!all.length)return '';
  return aisle.toUpperCase()+'\n'+all.map(i=>
   (state.checked[i.id]?'☑':'☐')+' '+i.name+' — '+(i.isManual?(i.qty||'À acheter'):gram(i.g,i.eff))+
   (assigned(i.id,i.aisle)?' · '+(stores.find(s=>s.id===assigned(i.id,i.aisle))?.name||''):'')
  ).join('\n');
 }).filter(Boolean);
 return '🥬 MON PANIER — SEMAINE DU '+weekLabel(state.weekKey)+'\n'+state.people+' PERSONNE(S)\n\n'+groups.join('\n\n')+'\n\nLes coches de ce message ne se synchronisent pas automatiquement.';
}
function fallbackCopy(t){
 const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;top:0;left:0;opacity:0';
 document.body.appendChild(a);a.focus();a.select();
 let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();
 if(ok)notify('Copié ! Vous pouvez le coller dans WhatsApp.');
 else window.prompt('Sélectionnez et copiez ce texte :',t);
}
async function copyText(t){
 try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(t);notify('Copié ! Vous pouvez le coller dans WhatsApp.');return}}
 catch(e){}fallbackCopy(t);
}
async function share(){
 const message=buildListText();
 if(navigator.share){
  try{await navigator.share({title:'Mon Panier — liste de courses',text:message});return}
  catch(e){if(e.name==='AbortError')return}
 }
 await copyText(message);
}
async function copyList(){await copyText(buildListText())}
async function shareLink(){
 if(location.protocol==='file:'){notify('Publiez l’application sur GitHub Pages pour partager le lien.');return}
 const payload={ready:true,weekKey:state.weekKey,people:state.people,stores:state.stores,checked:state.checked,subs:state.subs,assign:state.assign,unavailable:state.unavailable,manual:state.manual,photos:state.photos};
 const encoded=btoa(unescape(encodeURIComponent(JSON.stringify(payload)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'');
 const url=location.origin+location.pathname+'?partage='+encoded;
 try{if(navigator.share){await navigator.share({title:'Importer ma liste Mon Panier',text:'Ouvre ce lien pour importer une copie du menu et de la liste 🥬',url});return}}
 catch(e){if(e.name==='AbortError')return}
 await copyText(url);
}
function applySwipeState(){
 document.querySelectorAll('.manual-swipe').forEach(shell=>{
  const visible=shell.dataset.swipeId===openSwipeId;
  shell.classList.toggle('swipe-open',visible);
  const more=shell.querySelector('.manual-swipe-more');
  const btn=shell.querySelector('.swipe-delete');
  if(more)more.setAttribute('aria-expanded',String(visible));
  if(btn){btn.tabIndex=visible?0:-1;btn.setAttribute('aria-hidden',String(!visible))}
 });
}
let swipeTouch=null;
document.addEventListener('touchstart',e=>{
 const shell=e.target.closest('.manual-swipe');
 if(!shell||e.touches.length!==1||e.target.closest('button,input,select,textarea,a')){swipeTouch=null;return}
 swipeTouch={id:shell.dataset.swipeId,shell,x:e.touches[0].clientX,y:e.touches[0].clientY,base:openSwipeId===shell.dataset.swipeId?-104:0,dragging:false};
},{passive:true});
document.addEventListener('touchmove',e=>{
 if(!swipeTouch||!e.touches.length)return;
 const dx=e.touches[0].clientX-swipeTouch.x,dy=e.touches[0].clientY-swipeTouch.y;
 if(!swipeTouch.dragging){
  if(Math.abs(dx)<14&&Math.abs(dy)<14)return;
  if(Math.abs(dy)>=Math.abs(dx)){swipeTouch=null;return}
  swipeTouch.dragging=true;
 }
 const card=swipeTouch.shell.querySelector('.manual-swipe-content');
 if(card){card.style.transition='none';card.style.transform='translateX('+Math.max(-104,Math.min(0,swipeTouch.base+dx))+'px)'}
},{passive:true});
document.addEventListener('touchend',e=>{
 if(!swipeTouch)return;
 const touch=swipeTouch;swipeTouch=null;
 const card=touch.shell.querySelector('.manual-swipe-content');
 if(card){card.style.removeProperty('transition');card.style.removeProperty('transform')}
 if(!touch.dragging)return;
 const delta=e.changedTouches[0].clientX-touch.x;
 openSwipeId=(touch.base+delta)<-52?touch.id:null;
 applySwipeState();
},{passive:true});
document.addEventListener('touchcancel',()=>{
 if(swipeTouch){const card=swipeTouch.shell.querySelector('.manual-swipe-content');if(card){card.style.removeProperty('transition');card.style.removeProperty('transform')}}
 swipeTouch=null;applySwipeState();
},{passive:true});

let lastFocus=null;
document.addEventListener('click',e=>{
 if(openSwipeId&&!e.target.closest('.manual-swipe')){openSwipeId=null;applySwipeState()}
 const t=e.target.closest('[data-action]');if(!t)return;const action=t.dataset.action;
 if(action==='external')return;
 if(action==='toggle-store-card'){if(e.target.closest('a')||e.target.closest('input'))return;changeStore(t.dataset.id);return}
 if(action==='goto'){ui.tab=t.dataset.tab;ui.modal=null;render();window.scrollTo({top:0,behavior:'smooth'});return}
 if(action==='finish-setup'){state.ready=true;store();ui.tab='plan';render();scrollTo({top:0});return}
 if(action==='storetype'){ui.shopType=t.dataset.type;render();return}
 if(action==='minus-person'||action==='plus-person'){state.people=Math.max(1,Math.min(8,state.people+(action==='plus-person'?1:-1)));store();render();return}
 if(action==='toggle-sub'){ui.openSub=ui.openSub===t.dataset.id?null:t.dataset.id;updateResults();return}
 if(action==='choose-sub'){if(t.dataset.sub)state.subs[t.dataset.id]=t.dataset.sub;else delete state.subs[t.dataset.id];delete state.checked[t.dataset.id];ui.openSub=null;store();render();notify('Liste et nutrition actualisées');return}
 if(action==='recipe-filter'){ui.recipeFilter=t.dataset.filter;render();return}
 if(action==='open-recipe'){ui.modal=t.dataset.id;render();return}
 if(action==='close-modal'){ui.modal=null;render();return}
 if(action==='close-modal-overlay'){if(e.target===t){ui.modal=null;render()}return}
 if(action==='go-shop-from-recipe'){ui.modal=null;ui.tab='courses';render();window.scrollTo({top:0});return}
 if(action==='share'){share();return}
 if(action==='share-link'){shareLink();return}
 if(action==='restore-archive'){const old=state.archives[Number(t.dataset.index)];if(old&&isValidPlan(old.plan)&&confirm('Remplacer le menu de cette semaine par ce menu archivé ? La liste actuelle sera remise à zéro.')){state.weekPlan=old.plan.map(x=>x.slice());state.checked={};state.manual=[];store();ui.tab='plan';render();notify('Menu archivé réutilisé !')}return}
 if(action==='copy-list'){copyList();return}
 if(action==='toggle-manual-swipe'){openSwipeId=openSwipeId===t.dataset.id?null:t.dataset.id;applySwipeState();return}
 if(action==='missing-store'){
  const id=t.dataset.id,storeId=t.dataset.store;
  if(!state.stores.includes(storeId)||assigned(id)!==storeId)return;
  const blocked=blockedStores(id);
  state.unavailable[id]=[...new Set([...blocked,storeId])];
  delete state.assign[id];
  store();render();
  const next=stores.find(s=>s.id===assigned(id));
  notify(next?'Noté. À chercher ensuite chez '+next.name+' (stock non vérifié).':'Noté. Aucun autre magasin sélectionné à vérifier.');
  return;
 }
 if(action==='reset-store-availability'){
  const id=t.dataset.id;delete state.unavailable[id];delete state.assign[id];store();render();
  notify('Tes signalements ont été annulés pour cet article.');return;
 }
 if(action==='delete-manual'){const id=t.dataset.id;if(!state.manual.some(x=>x.id===id))return;state.manual=state.manual.filter(x=>x.id!==id);delete state.checked[id];delete state.assign[id];delete state.unavailable[id];openSwipeId=null;store();render();notify('Produit supprimé des courses en plus');return}
 if(action==='reset-checked'){if(confirm('Remettre tous les articles en « à acheter » ?')){state.checked={};store();render();notify('Liste réinitialisée')}return}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.matches('[data-store]')){changeStore(t.dataset.store);return}
 if(t.matches('[data-check]')){if(t.checked)state.checked[t.dataset.check]=true;else delete state.checked[t.dataset.check];store();render();return}
 if(t.matches('[data-assign]')){state.assign[t.dataset.assign]=t.value;
  state.unavailable[t.dataset.assign]=blockedStores(t.dataset.assign).filter(id=>id!==t.value);
  store();updateResults();return}
 if(t.id==='purchase-filter'){ui.filter=t.value;updateResults();return}
 if(t.id==='store-filter'){ui.shopFilter=t.value;updateResults();return}
 if(t.id==='photo-toggle'){state.photos=t.checked;store();render();return}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){ui.search=e.target.value;updateResults()}});
document.addEventListener('submit',e=>{if(e.target.id!=='manual-form')return;e.preventDefault();const name=el('manual-name').value.trim(),qty=el('manual-qty').value.trim();if(!name)return;state.manual.push({id:'custom-'+Date.now(),name,qty,isManual:true});store();render();notify('Produit ajouté');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;render()}});
load();render();loadAI();loadRetailCatalog();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&rollover()){render();notify('Nouvelle semaine : menus et courses renouvelés !')}});
setInterval(()=>{if(rollover()){render();notify('Nouvelle semaine : menus et courses renouvelés !')}},60*60*1000);

})();
</script>
